name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge fuer die Logo-Animation
        run: sudo apt-get update && sudo apt-get install -y python3-pil python3-numpy
      - name: Pakete bauen
        run: ./build_release.sh "${GITHUB_REF_NAME#v}"
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

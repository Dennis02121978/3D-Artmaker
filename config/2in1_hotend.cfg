# ------------------------------------------------------------------
# MANUELLE EXTRUDER LADEN FUNKTION
# ------------------------------------------------------------------
[gcode_macro EXTRUDER_LADEN]
description: Manuelles Laden für Wartung. Ohne TOOL beide Werkzeuge, mit TOOL=0 oder TOOL=1 nur dieses.
gcode:
    # Heizt selbst auf mindestens 190 C, eine hoehere Solltemperatur bleibt erhalten
    M117 Heize Nozzle...
    M109 S{[190, printer.extruder.target|float]|max}
    {% if params.TOOL is defined %}
        {% set tool = params.TOOL|int %}
        _PREPARE_TOOLS TARGET={tool} PRIME_T0={1 if tool == 0 else 0} PRIME_T1={1 if tool == 1 else 0}
    {% else %}
        _PREPARE_TOOLS TARGET={printer["gcode_macro _TOOL_STATE"].active_tool}
    {% endif %}
    M117 Laden fertig

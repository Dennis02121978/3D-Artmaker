# ------------------------------------------------------------------
# EINSTELLUNGEN UND STATUS
# ------------------------------------------------------------------
[gcode_macro _TOOL_STATE]
variable_active_tool: 0      # Standard beim Start: T0
# Vom Schalter bis zum Hotend sind es 65 mm, die Parkposition liegt 5 mm hinter dem Schalter.
# Geparkt ist der Schalter frei und das Filament damit aus dem gemeinsamen Weg.
variable_park_dist: 70       # Parkposition: Abstand zum Hotend (mm)
variable_load_dist: 65       # Laden beim Werkzeugwechsel (mm), Rest foerdert der Purge-Turm
variable_prime_dist: 65      # Strecke Schalter bis Hotend (mm), gemessen
variable_prime_purge: 0      # Purge vor dem Druck (mm), laeuft langsam, 0 = aus
variable_clear_limit: 120    # Max. Rueckzug, bis der Sensor frei sein muss (mm)
variable_feed_limit: 100     # Max. Vorschub, bis der Sensor ausloesen muss (mm)
variable_mesh_temp: 150      # Nozzle-Temperatur beim Bed Mesh (C)
variable_purge_x: 0          # Purge-Position
variable_purge_y: -25
variable_purge_z: 15
gcode:
    # Nur Variablen - keine Aktion noetig

# ------------------------------------------------------------------
# HILFSMAKROS
# ------------------------------------------------------------------
# Wichtig: Klipper wertet ein Makro komplett aus, bevor der erste Befehl
# laeuft. Sensorabfragen nach einer Bewegung muessen deshalb in einem
# eigenen Untermakro stehen - das wird erst beim Aufruf ausgewertet.

[gcode_macro _SYNC_TOOL]
gcode:
    {% set tool = params.TOOL|int %}
    {% if tool == 0 %}
        SYNC_EXTRUDER_MOTION EXTRUDER="extruder" MOTION_QUEUE="extruder"
        SYNC_EXTRUDER_MOTION EXTRUDER="extruder1" MOTION_QUEUE=""
    {% else %}
        SYNC_EXTRUDER_MOTION EXTRUDER="extruder" MOTION_QUEUE=""
        SYNC_EXTRUDER_MOTION EXTRUDER="extruder1" MOTION_QUEUE="extruder"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TOOL_STATE VARIABLE=active_tool VALUE={tool}
    {% if printer.save_variables.variables.active_tool|default(-1)|int != tool %}
        SAVE_VARIABLE VARIABLE=active_tool VALUE={tool}
    {% endif %}

# Aktives Werkzeug bleibt ueber Neustarts erhalten
[save_variables]
filename: ~/printer_data/config/variables.cfg

[delayed_gcode _RESTORE_TOOL]
initial_duration: 1
gcode:
    _SYNC_TOOL TOOL={printer.save_variables.variables.active_tool|default(0)|int}

[gcode_macro _ASSERT_SENSOR]
gcode:
    {% set tool = params.TOOL|int %}
    {% set sensor = "filament_sensor_left" if tool == 0 else "filament_sensor_right" %}
    {% if printer["gcode_button " ~ sensor].state != params.EXPECT %}
        {% if params.EXPECT == "PRESSED" %}
            {action_raise_error("ABBRUCH: T%d Filament erreicht den Sensor nicht (%s)." % (tool, sensor))}
        {% else %}
            {action_raise_error("ABBRUCH: T%d Sensor wird nicht frei (%s). Filament und Sensor pruefen." % (tool, sensor))}
        {% endif %}
    {% endif %}

# Geladenes Werkzeug muss am Sensor Filament melden, sonst Pause statt Luftdruck
[gcode_macro _PAUSE_IF_NO_FILAMENT]
gcode:
    {% set tool = params.TOOL|int %}
    {% set sensor = "filament_sensor_left" if tool == 0 else "filament_sensor_right" %}
    {% if printer["gcode_button " ~ sensor].state != "PRESSED" %}
        RESPOND TYPE=error MSG="T{tool} meldet kein Filament - Druck pausiert!"
        PAUSE
    {% endif %}

# ------------------------------------------------------------------
# TOOLCHANGE MAKROS (FUER DEN DRUCK)
# ------------------------------------------------------------------
# SAVE/RESTORE_GCODE_STATE erhaelt E-Modus, Geschwindigkeit und logische
# E-Position. Der Wechsel funktioniert so mit M82 und M83.
[gcode_macro _TOOLCHANGE]
gcode:
    {% set tool = params.TOOL|int %}
    {% set state = printer["gcode_macro _TOOL_STATE"] %}
    {% if state.active_tool != tool %}
        SAVE_GCODE_STATE NAME=_toolchange
        M83
        G1 E-{state.park_dist} F3000
        G4 P100
        M400
        # Altes Filament muss aus dem Zusammenlauf sein, sonst Abbruch statt Stau
        _ASSERT_SENSOR TOOL={state.active_tool} EXPECT=RELEASED
        _SYNC_TOOL TOOL={tool}
        G1 E{state.load_dist} F400
        G4 P100
        M400
        RESTORE_GCODE_STATE NAME=_toolchange
        _PAUSE_IF_NO_FILAMENT TOOL={tool}
    {% else %}
        _SYNC_TOOL TOOL={tool}
    {% endif %}

[gcode_macro T0]
description: Wechselt auf Extruder Links (T0).
gcode:
    _TOOLCHANGE TOOL=0

[gcode_macro T1]
description: Wechselt auf Extruder Rechts (T1).
gcode:
    _TOOLCHANGE TOOL=1

# ------------------------------------------------------------------
# START PRINT
# ------------------------------------------------------------------
# OrcaSlicer Start-G-Code:
# PRINT_START EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[bed_temperature_initial_layer_single] PRINT_MIN={first_layer_print_min[0]},{first_layer_print_min[1]} PRINT_MAX={first_layer_print_max[0]},{first_layer_print_max[1]} INITIAL_TOOL=[initial_tool] USED_T0={is_extruder_used[0]} USED_T1={is_extruder_used[1]}
# Ohne USED_T0/USED_T1 werden beide Werkzeuge geprimt.
[gcode_macro PRINT_START]
gcode:
    {% set state = printer["gcode_macro _TOOL_STATE"] %}
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set hotend_temp = params.EXTRUDER_TEMP|default(200)|float %}
    {% set mesh_temp = [state.mesh_temp|float, hotend_temp]|min %}
    {% set initial_tool = params.INITIAL_TOOL|default(0)|int %}
    {% set used_t0 = initial_tool == 0 or params.USED_T0|default("true")|lower in ("true", "1") %}
    {% set used_t1 = initial_tool == 1 or params.USED_T1|default("true")|lower in ("true", "1") %}

    BED_MESH_CLEAR
    G28

    # Heizen und Bed Mesh: Nozzle nur vorwaermen, damit sie beim Messen nicht tropft
    M117 Heating...
    M140 S{bed_temp}
    M109 S{mesh_temp}
    M190 S{bed_temp}

    M117 Abgleich DMS !
    {% if params.PRINT_MIN is defined and params.PRINT_MAX is defined %}
        BED_MESH_CALIBRATE PRINT_MIN={params.PRINT_MIN} PRINT_MAX={params.PRINT_MAX} FORCE_PRINT_AREA_BED_MESH=1
    {% else %}
        BED_MESH_CALIBRATE
    {% endif %}

    # Zur Purge-Position und auf Drucktemperatur
    G90
    G1 Z{state.purge_z} F600
    G1 X{state.purge_x} Y{state.purge_y} F6000
    M117 Heating Nozzle...
    M109 S{hotend_temp}

    _PREPARE_TOOLS TARGET={initial_tool} PRIME_T0={1 if used_t0 else 0} PRIME_T1={1 if used_t1 else 0}
    G92 E0
    M117 Druck startet!

# ------------------------------------------------------------------
# SENSOR FREIMACHEN UND PRIMEN
# ------------------------------------------------------------------
# Alles laeuft synchron im Makro: Der Druck beginnt erst danach.
[gcode_macro _PREPARE_TOOLS]
gcode:
    {% set state = printer["gcode_macro _TOOL_STATE"] %}
    {% set target = params.TARGET|default(0)|int %}
    SAVE_GCODE_STATE NAME=_prepare_tools
    M83
    _CLEAR_SENSOR TOOL=0
    _CLEAR_SENSOR TOOL=1
    {% if params.PRIME_T0|default(1)|int == 1 %}
        _PRIME_TOOL TOOL=0
    {% endif %}
    {% if params.PRIME_T1|default(1)|int == 1 %}
        _PRIME_TOOL TOOL=1
    {% endif %}
    M117 Aktiviere T{target}...
    _SYNC_TOOL TOOL={target}
    # Von der Parkposition bis zum Hotend, das sind 65 mm ab Schalter
    G1 E{state.park_dist} F1000
    {% if state.prime_purge|float > 0 %}
        # Schmelze foerdern geht nur langsam, sonst dreht das Filament durch
        G1 E{state.prime_purge} F120
    {% endif %}
    RESTORE_GCODE_STATE NAME=_prepare_tools

[gcode_macro _CLEAR_SENSOR]
gcode:
    {% set tool = params.TOOL|int %}
    M117 T{tool} freimachen...
    _SYNC_TOOL TOOL={tool}
    {% for i in range(printer["gcode_macro _TOOL_STATE"].clear_limit|int) %}
        _CLEAR_STEP TOOL={tool}
    {% endfor %}
    _ASSERT_SENSOR TOOL={tool} EXPECT=RELEASED

[gcode_macro _CLEAR_STEP]
gcode:
    {% set tool = params.TOOL|int %}
    {% set sensor = "filament_sensor_left" if tool == 0 else "filament_sensor_right" %}
    {% if printer["gcode_button " ~ sensor].state == "PRESSED" %}
        G1 E-1 F3000
        G4 P50
        M400
    {% endif %}

[gcode_macro _PRIME_TOOL]
gcode:
    {% set state = printer["gcode_macro _TOOL_STATE"] %}
    {% set tool = params.TOOL|int %}
    M117 Prime T{tool}...
    _SYNC_TOOL TOOL={tool}
    # Erst bis zum Ausloesen foerdern, dann ist die Lage der Spitze bekannt
    {% for i in range(state.feed_limit|int) %}
        _FEED_STEP TOOL={tool}
    {% endfor %}
    _ASSERT_SENSOR TOOL={tool} EXPECT=PRESSED
    G1 E{state.prime_dist} F1000
    G1 E-{state.park_dist} F3000
    G4 P100
    M400
    _ASSERT_SENSOR TOOL={tool} EXPECT=RELEASED

[gcode_macro _FEED_STEP]
gcode:
    {% set tool = params.TOOL|int %}
    {% set sensor = "filament_sensor_left" if tool == 0 else "filament_sensor_right" %}
    {% if printer["gcode_button " ~ sensor].state != "PRESSED" %}
        G1 E1 F300
        G4 P50
        M400
    {% endif %}

# ------------------------------------------------------------------
# END PRINT
# ------------------------------------------------------------------
[gcode_macro PRINT_END]
variable_machine_depth: 235
gcode:
    # Ziele auf die Achsgrenzen begrenzen, auch mit Z-Offset (Babystepping)
    {% set pos = printer.gcode_move.gcode_position %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% set limit = printer.toolhead.axis_maximum %}
    {% set x_max = limit.x - origin.x %}
    {% set y_max = limit.y - origin.y %}
    {% set z_max = limit.z - origin.z %}
    M140 S0
    M104 S0
    M106 S0
    G90
    M83
    G1 Z{[pos.z + 0.2, z_max]|min} E-2 F2400
    G1 X{[pos.x + 5, x_max]|min} Y{[pos.y + 5, y_max]|min} F6000
    G1 Z{[pos.z + 10, z_max]|min} F6000
    G1 X0 Y200 F6000
    G1 Z{z_max} F14000
    M84
    BED_MESH_CLEAR
    M117 Druck erfolgreich beendet!
    SET_LED LED=Led RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1

# ------------------------------------------------------------------
# SENSOREN (ALS BUTTONS DEFINIERT)
# ------------------------------------------------------------------
# Ersetzt filament_switch_sensor.
# Status ist nun lesbar über printer["gcode_button Name"].state
# state ist entweder "PRESSED" (aktiv) oder "RELEASED" (inaktiv)

[gcode_button filament_sensor_left]
pin: PE15
press_gcode:
  # Optional: Code der beim Drücken ausgeführt wird (Debugging)
  # M118 Sensor Links PRESSED
release_gcode:
  # Optional: Code der beim Loslassen ausgeführt wird
  # M118 Sensor Links RELEASED

[gcode_button filament_sensor_right]
pin: PD9
press_gcode:
  # M118 Sensor Rechts PRESSED
release_gcode:
  # M118 Sensor Rechts RELEASED


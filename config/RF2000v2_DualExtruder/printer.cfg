# Renkforce RF2000 v2 Dual Extruder, Filament 1.75 mm
# Erzeugt mit dem Renkforce Klipper Config Creator
# Wer ein anderes Hotend benutzt, bitte die Rotation Distance anpassen.
#
# HAFTUNGSAUSSCHLUSS: Diese Config wird ohne jede Gewaehr bereitgestellt. Die Nutzung
# erfolgt auf eigene Gefahr, eine Haftung fuer Schaeden an Drucker, Umgebung oder
# Personen ist ausgeschlossen. Alle Werte (Pins, Maße, Endstops, Temperaturen) vor der
# Inbetriebnahme selbst pruefen, die ersten Bewegungen mit der Hand am Not-Halt machen.
#
# PIN INVERTIEREN: Ein "!" vor dem Pin kehrt dessen Logik um, z.B. "!PC6" statt "PC6".
# Meldet QUERY_ENDSTOPS im Ruhezustand "triggered", obwohl der Endstop frei ist (oder
# umgekehrt), das "!" einfach entfernen bzw. hinzufuegen. Ohne diesen Test kann die
# Achse in den Anschlag fahren.

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AL03P23U-if00-port0


[exclude_object]

[include mainsail.cfg]
[include macros.cfg]
[include offset_test.cfg]
[include z_tasten.cfg]
[include rf_display.cfg]
[include rf_led.cfg]

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1500
max_z_velocity: 50
max_z_accel: 70

[safe_z_home]
home_xy_position: 0,-5
z_hop: 2

[force_move]
enable_force_move: True

[stepper_x]
step_pin: PF0
dir_pin: !PF1
enable_pin: PD7
rotation_distance: 42
microsteps: 32
endstop_pin: !PC2
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 40.0
second_homing_speed: 10.0

[drv8711 stepper_x]
cs_pin: PL0
spi_software_sclk_pin: PD5
spi_software_miso_pin: PD4
spi_software_mosi_pin: PD6
current: 2


[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: PF2
rotation_distance: 42
microsteps: 32
endstop_pin: !PC0
# Y=0 ist die Vorderkante des Betts, der Home-Schalter liegt 10 mm davor
position_endstop: -10
position_min: -10
position_max: 300
homing_speed: 35.0
second_homing_speed: 10.0

[drv8711 stepper_y]
cs_pin: PL2
spi_software_sclk_pin: PD5
spi_software_miso_pin: PD4
spi_software_mosi_pin: PD6
current: 2

[stepper_z]
step_pin: PF3
dir_pin: PL1
enable_pin: PK0
rotation_distance: 2.5
microsteps: 32
endstop_pin: !PC6
# Endstop liegt bei Z=0. Mit position_min wird festgelegt, wie weit die Achse
# darunter weiterfahren darf (Ueberfahrweg), weil der Schalter erst ausloest,
# wenn der Tisch schon etwas unter der Duese liegt.
# Lichtschranke: ca. 1,2 mm Ueberfahrweg
position_endstop: 0
position_min: -1.2
position_max: 190
homing_speed: 8.0
second_homing_speed: 2.0

[drv8711 stepper_z]
cs_pin: PB6
spi_software_sclk_pin: PD5
spi_software_miso_pin: PD4
spi_software_mosi_pin: PD6
current: 2

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: PA2
microsteps: 32
rotation_distance: 22.857
nozzle_diameter: 0.4
filament_diameter: 1.75
min_temp: 0
max_temp: 260
min_extrude_temp: 170
heater_pin: PB4
sensor_type: EPCOS 100K B57550G0104
sensor_pin: PK5
pullup_resistor: 4700
inline_resistor: 0
pressure_advance: 0.1
control: pid
pid_kp: 38.710
pid_ki: 2.412
pid_kd: 155.323
max_extrude_cross_section: 50.0
max_extrude_only_distance: 50.0


[drv8711 extruder]
cs_pin: PL6
spi_software_sclk_pin: PD5
spi_software_miso_pin: PD4
spi_software_mosi_pin: PD6
current: 1.8

################################################################################################
# Zweiter Extruder                                                                             #
################################################################################################
[extruder1]
step_pin: PC1
dir_pin: !PC3
enable_pin: PC7
microsteps: 32
rotation_distance: 22.857
nozzle_diameter: 0.4
filament_diameter: 1.75
min_temp: 0
max_temp: 260
min_extrude_temp: 170
heater_pin: PH6
sensor_type: EPCOS 100K B57550G0104
sensor_pin: PK6
pullup_resistor: 4700
inline_resistor: 0
pressure_advance: 0.1
control: pid
pid_kp: 38.710
pid_ki: 2.412
pid_kd: 155.323
max_extrude_cross_section: 50.0
max_extrude_only_distance: 50.0


[drv8711 extruder1]
cs_pin: PJ7
spi_software_sclk_pin: PD5
spi_software_miso_pin: PD4
spi_software_mosi_pin: PD6
current: 1.8

################################################################################################

[thermistor EPCOS 100K B57550G0104]
temperature1: 25
resistance1: 100000
beta: 4150

[heater_bed]
control: pid
pid_kp: 58.098
pid_ki: 0.656
pid_kd: 1285.418
heater_pin: PE2
sensor_type: EPCOS 100K B57550G0104
sensor_pin: PK7
min_temp: 5
max_temp: 130


[fan]
pin: PA5
max_power: 1.0
kick_start_time: 0.100

[controller_fan fan2]
pin: PF4
fan_speed: 0.5
heater: extruder,extruder1,heater_bed

[led led]
red_pin: PH3
green_pin: PH4
blue_pin: PH5
cycle_time: 0.010
hardware_pwm: False
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0


[virtual_sdcard]
path: ~/printer_data/gcodes

# SD-Karte im Kartenleser des Druckers (Modul rf_sdcard aus dem Klipper-Fork).
# Display: SD Karte > Drucke Datei > SD-Karte. Konsole: RF_SD_LIST, RF_SD_PRINT FILE=...
# Gedruckt wird eine Kopie im G-Code-Ordner (Unterordner SD-Karte).
[rf_sdcard]
cs_pin: PB0
detect_pin: ^!PD2

# Einstellungen aus dem Display-Menue (rf_display.cfg), wie im EEPROM der RF-Firmware
[save_variables]
filename: ~/printer_data/config/rf_variables.cfg

[pause_resume]

[display]
lcd_type: hd44780
rs_pin: PK1
e_pin: PK3
d4_pin: PF5
d5_pin: PK2
d6_pin: PA1
d7_pin: PJ3
# Startanzeige und Menue wie in der RF-Repetier-Firmware (rf_display.cfg)
display_group: rf_splash
menu_root: rf
menu_pages: rf_page1, rf_page_mod, rf_page2, rf_page3, rf_page4
# RF2000-Display: 20x4, Zurueck-Taste statt ".."-Eintrag, westlicher Zeichensatz fuer Umlaute
menu_show_back: False
hd44780_charset: western
# Werte im Menue aendern: Taste hoch erhoeht, Taste runter verringert
menu_reverse_input: True

#RE=TAST3:PH0, Ok=TAST1:PG5, DN=TAST2:PB7, LE=TAST4:PB5, UP=TAST5:PL7,
#PAUSE=TAST_E6:PH2, Z-DN=TAST_E2:PJ4, CONT=TAST_E5:PH7,
#F_REV=TAST_E3:PJ5, F-FWD=TAST_E4:PJ6, Z-UP=TAST_E1:PJ2
click_pin: !PG5
back_pin: !PB5
up_pin: !PL7
down_pin: !PB7
#kill_pin: !PH0 # This is the right arrow key, otherwise unused


[ads1100 load_cell]
gain: 2

[rf1000_pressure_guard]
# Notfall-Pause und Flow-Kompensation per DMS (Modul rf1000_pressure_guard.py).
# Werte in der Einheit von LCP_READ. 0 = aus.
emergency_min: -6000
emergency_max: 6000
emergency_samples: 5
pause_gcode: PAUSE
flow_min: 400
flow_max: 800
flow_percent: 30
feed_percent: 30
flow_min_z: 0.2


[rf1000_load_cell_probe]
adc: load_cell:None
adc_rate: 16
max_abs_force: 5000
# Bereichsschutz des ADC: Shutdown erst oberhalb dieses Werts. Muss ueber den Grenzen der Notfall-Pause liegen,
# sonst stoppt Klipper (ADC out of range) statt zu pausieren. Messkraft beim PROBE bleibt durch max_abs_force bestimmt.
adc_max_abs_force: 8000
noise_level = 1.5
force_calibration = 8500
stiffness = 6200


[bed_mesh]
speed: 100
horizontal_move_z: 2
mesh_min: 10,50
mesh_max: 200,275
algorithm: bicubic
probe_count: 6,9
fade_start: 1.0
fade_end: 10.0


[z_sense_offset]
# Sense Offset: hebt das Bett im ersten Layer an, wenn die Kraft ueber der Schwelle liegt.
# Wird mit Z_SENSE_OFFSET in PRINT_START eingeschaltet (Homing schaltet ihn wieder aus).
force_threshold: 500
max_z_offset: 0.2
max_z_height: 0.33


[display_template _load_cell_digits]
text:
  { "F%5d" % (printer["rf1000_load_cell_probe"].last_force) }

[display_data _default_16x4 load_cell_digits]
position: 0, 10
text: { render("_load_cell_digits") }

# Zeile 4: Statustext, rechts der Sense Offset in mm (S0.000), solange er an ist oder einen Wert hat
[display_data _default_16x4 print_status]
position: 3, 0
# (eine Zeile, damit keine Leerzeichen aus der Vorlage mitgezaehlt werden)
text:
  {% set so = printer.z_sense_offset %}{% set st = render("_print_status")|trim %}{% if so.enabled or so.z_offset > 0 %}{ "%-10.10s" % st }{ "S%5.3f" % so.z_offset }{% else %}{ st }{% endif %}


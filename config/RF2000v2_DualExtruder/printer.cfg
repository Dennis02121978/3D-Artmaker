# Renkforce RF2000 Dual Hotend v2 3D printer
# Wer ein anderes Hotend benutzt, bitte die Rotation Distance anpassen.

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AL03P23U-if00-port0


[exclude_object]

[include mainsail.cfg]
[include macros.cfg]
[include z_tasten.cfg]

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1500
max_z_velocity: 50
max_z_accel: 70

[safe_z_home]
home_xy_position: 0,-5
z_hop: 2

[force_move]
enable_force_move: True

[stepper_x]
step_pin: PF0
dir_pin: !PF1
enable_pin: PD7
rotation_distance: 42
microsteps: 32
endstop_pin: !PC2
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 40.0
second_homing_speed: 10.0

[drv8711 stepper_x]
cs_pin: PL0
spi_software_sclk_pin: PD5
spi_software_miso_pin: PD4
spi_software_mosi_pin: PD6
current: 2


[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: PF2
rotation_distance: 42
microsteps: 32
endstop_pin: !PC0
position_endstop: -5
position_min: -5
position_max: 285
homing_speed: 35.0
second_homing_speed: 10.0

[drv8711 stepper_y]
cs_pin: PL2
spi_software_sclk_pin: PD5
spi_software_miso_pin: PD4
spi_software_mosi_pin: PD6
current: 2

[stepper_z]
step_pin: PF3
dir_pin: PL1
enable_pin: PK0
rotation_distance: 2.5
microsteps: 32
endstop_pin: !PC6
#position_endstop: 0.332
position_min: -0.9
position_max: 185
homing_speed: 8.0
second_homing_speed: 2.0

[drv8711 stepper_z]
cs_pin: PB6
spi_software_sclk_pin: PD5
spi_software_miso_pin: PD4
spi_software_mosi_pin: PD6
current: 2

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: PA2
microsteps: 32
rotation_distance: 22.86
nozzle_diameter: 0.4
filament_diameter: 1.750
min_temp: 0
max_temp: 260
min_extrude_temp: 170
heater_pin: PB4
sensor_type: EPCOS 100K B57550G0104
sensor_pin: PK5
pullup_resistor: 4700
inline_resistor: 0
pressure_advance: 0.1
control: pid
pid_kp: 38.710
pid_ki: 2.412
pid_kd: 155.323
max_extrude_cross_section: 50.0
max_extrude_only_distance: 50.0


[drv8711 extruder]
cs_pin: PL6
spi_software_sclk_pin: PD5
spi_software_miso_pin: PD4
spi_software_mosi_pin: PD6
current: 1.8

################################################################################################
# RF2000v2 DUAL Extruder 1.75mm v2                                                                     #
################################################################################################
[extruder1]
step_pin: PC1
dir_pin: !PC3
enable_pin: PC7
microsteps: 32
rotation_distance: 22.86
nozzle_diameter: 0.4
filament_diameter: 1.750
min_temp: 0
max_temp: 260
min_extrude_temp: 170
heater_pin: PH6
sensor_type: EPCOS 100K B57550G0104
sensor_pin: PK6
pullup_resistor: 4700
inline_resistor: 0
pressure_advance: 0.1
control: pid
pid_kp: 38.710
pid_ki: 2.412
pid_kd: 155.323
max_extrude_cross_section: 50.0
max_extrude_only_distance: 50.0


[drv8711 extruder1]
cs_pin: PJ7
spi_software_sclk_pin: PD5
spi_software_miso_pin: PD4
spi_software_mosi_pin: PD6
current: 1.8


################################################################################################

[thermistor EPCOS 100K B57550G0104]
temperature1: 25
resistance1: 100000
beta: 4150

[heater_bed]
control: pid
pid_kp: 58.098
pid_ki: 0.656
pid_kd: 1285.418
heater_pin: PE2
sensor_type: EPCOS 100K B57550G0104
sensor_pin: PK7
min_temp: 5
max_temp: 130


[fan]
pin: PA5
max_power: 1.0
kick_start_time: 0.100

[controller_fan fan2]
pin: PF4
fan_speed: 0.5
heater: extruder,extruder1,heater_bed

[led led]
red_pin: PH3
green_pin: PH4
blue_pin: PH5
cycle_time: 0.010
hardware_pwm: False
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0


[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[pause_resume]

[display]
lcd_type: hd44780
rs_pin: PK1
e_pin: PK3
d4_pin: PF5
d5_pin: PK2
d6_pin: PA1
d7_pin: PJ3
display_group: _default_16x4

#RE=TAST3:PH0, Ok=TAST1:PG5, DN=TAST2:PB7, LE=TAST4:PB5, UP=TAST5:PL7,
#PAUSE=TAST_E5:PH7, Z-DN=TAST_E2:PJ4, CONT=TAST_E6:PH2,
#F_REV=TAST_E3:PJ5, F-FWD=TAST_E4:PJ6, Z-UP=TAST_E1:PJ2
click_pin: !PG5
back_pin: !PB5
up_pin: !PL7
down_pin: !PB7
#kill_pin: !PH0 # This is the right arrow key, otherwise unused



[ads1100 load_cell]
gain: 2

[rf1000_load_cell_probe]
adc: load_cell:None
adc_rate: 16
max_abs_force: 5000
noise_level = 1.5
force_calibration = 8500
stiffness = 6200


[bed_mesh]
speed: 100
horizontal_move_z: 2
mesh_min: 10,50
mesh_max: 200,260
algorithm:lagrange
probe_count: 5,5
fade_start: 1.0
fade_end: 10.0

  
[z_sense_offset]
force_threshold: 4000
max_z_offset: 0.2


[display_template _load_cell_digits]
text:
  { "F%5d" % (printer["rf1000_load_cell_probe"].last_force) }

[display_data _default_16x4 load_cell_digits]
position: 0, 10
text: { render("_load_cell_digits") }

